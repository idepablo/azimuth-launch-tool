version: 2

sources:
  - name: bronze
    catalog: azimuth
    schema: bronze
    description: Raw launch data as ingested from Launch Library 2. All columns string.
    tables:
      - name: launches
        description: One row per launch attempt, merged on launch_id.
        config:
          # Freshness is measured on the newest launch date, not on load
          # time: something launches somewhere almost every day, so a gap
          # of a week means the refresh has stopped, not that the world did.
          loaded_at_field: "cast(net as timestamp)"
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 14, period: day}
      - name: agencies
        description: Agency reference from the agencies endpoint, full snapshot.
      - name: launcher_configurations
        description: Launcher configuration reference, detailed mode, full snapshot.
      - name: launcher_families
        description: >
          One row per (configuration, family) from the configurations
          snapshot. Lists each configuration's family and its ancestors;
          the hierarchy is resolved in stg_vehicle_families.
