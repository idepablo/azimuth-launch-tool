name: dbt build

on:
  push:
    branches: [main]
  pull_request:
  # also called by refresh.yml after new data lands in bronze
  workflow_call:

jobs:
  # Builds and tests everything in the isolated `ci` schema.
  # Runs on every push and pull request; never touches silver or gold.
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azimuth_dbt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-databricks==1.12.3

      - name: Write dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          azimuth_dbt:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: azimuth
                schema: ci
                host: ${{ secrets.DBT_DATABRICKS_HOST }}
                http_path: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DBT_DATABRICKS_TOKEN }}
                threads: 1
          EOF

      - name: Build and test
        run: |
          dbt build | tee build.log
          # warnings do not fail the build; surface them on the run page
          if grep -qE "WARN=[1-9]" build.log; then
            echo "::warning title=dbt build::Passed with warnings. Most likely a new vehicle that needs a row in seeds/vehicle_classification.csv."
          fi

  # Deploys to the real silver and gold schemas, only on main (a push, or
  # the scheduled refresh) and only after the isolated build above has
  # passed every test. Pull requests never deploy.
  deploy:
    needs: dbt-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gold
      cancel-in-progress: false
    defaults:
      run:
        working-directory: azimuth_dbt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-databricks==1.12.3

      - name: Write dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          azimuth_dbt:
            target: prod
            outputs:
              prod:
                type: databricks
                catalog: azimuth
                schema: silver
                host: ${{ secrets.DBT_DATABRICKS_HOST }}
                http_path: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DBT_DATABRICKS_TOKEN }}
                threads: 1
          EOF

      - name: Deploy to silver and gold
        run: dbt build
